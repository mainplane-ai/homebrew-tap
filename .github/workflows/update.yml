name: update
# Moves the formula to the newest stable release named by dl.mainplane.ai/latest,
# after checking that the release key signed its SHA256SUMS.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: formula for the latest release
        run: |
          f=Formula/mainplane.rb
          tag=$(curl -fsS https://dl.mainplane.ai/latest)
          v=${tag#v}
          if grep -q "^  version \"$v\"$" $f; then echo "already $v"; exit 0; fi
          curl -fsS -O https://dl.mainplane.ai/$tag/SHA256SUMS -O https://dl.mainplane.ai/$tag/SHA256SUMS.sig
          # the public half of the release key in mainplane-ai/mainplane pkg/release/release.go
          printf '%s\n' "-----BEGIN PUBLIC KEY-----" "MCowBQYDK2VwAyEAEpmoycu6ik6l3iJiEtfOAdK+DLFDVXhgdc+uNv6ua/U=" "-----END PUBLIC KEY-----" > "$RUNNER_TEMP/release.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release.pem" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          sed -i "s/^  version \".*\"$/  version \"$v\"/" $f
          for t in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            h=$(awk -v n="mainplane-$t" '$2 == n {print $1}' SHA256SUMS)
            [ -n "$h" ] || { echo "$tag has no mainplane-$t"; exit 1; }
            sed -i "/mainplane-$t\"/{n;s/sha256 \".*\"/sha256 \"$h\"/}" $f
          done
          rm SHA256SUMS SHA256SUMS.sig
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qam "mainplane $v"
          git push -q
